name: Security Hardening Verification

on:
  push:
    branches: [security-hardening]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ftsm_table4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ftsm_table4_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ftsm_table4_test
      SESSION_SECRET: ci-placeholder-session-secret-for-tests-only
      RESET_TOKEN_SECRET: ci-placeholder-reset-secret-for-tests-only
      APP_URL: http://localhost:3000
      EMAIL_FROM: noreply@example.edu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Apply migrations to fresh PostgreSQL
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

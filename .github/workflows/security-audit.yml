name: Security Audit

on:
  push:
    branches: [security-audit-run]

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ftsm_table4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ftsm_table4_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ftsm_table4_test
      SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESET_TOKEN_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      APP_URL: http://localhost:3000
      EMAIL_FROM: Table 4 FTSM <noreply@example.edu>

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted overrides
        run: |
          npm pkg set 'overrides.deepmerge-ts=^8.0.0'
          npm pkg set 'overrides.mysql2=>3.23.0'
          npm pkg set 'overrides.uuid=^11.1.1'
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Show resolved security packages
        run: npm ls deepmerge-ts mysql2 uuid

      - name: NPM audit
        run: npm audit --audit-level=moderate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload verified package files
        uses: actions/upload-artifact@v4
        with:
          name: verified-security-package-files
          path: |
            package.json
            package-lock.json

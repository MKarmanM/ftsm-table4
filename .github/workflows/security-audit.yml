name: Security Audit

on:
  push:
    branches: [security-audit-run]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency tree
        run: npm ls --all || true

      - name: NPM audit
        run: npm audit --audit-level=moderate
